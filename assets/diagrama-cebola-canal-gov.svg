<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1260" viewBox="0 0 1500 1260" role="img" aria-labelledby="title desc">
<title id="title">Canal GOV — diagrama de cebola dos sete atores</title>
<desc id="desc">Plataforma proposta no centro. Núcleo: coordenação A6 e equipe técnica A7. Relação direta: trabalhador A1, equipe humana Caixa A3 e equipe MTE A5. Responsabilidade institucional: Caixa A2 e MTE A4. Anéis representam proximidade funcional, não hierarquia. Síntese do mapa decidido na entrevista.</desc>
